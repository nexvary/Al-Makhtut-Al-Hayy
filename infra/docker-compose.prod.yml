services:
  api:
    build: ../services/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET}"
      DATABASE_URL: "postgresql://makhtut:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/makhtut"
      REDIS_URL: "redis://redis:6379/0"
      OBJECT_STORE_PATH: "/data/objects"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - objects:/data/objects
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: makhtut
      POSTGRES_USER: makhtut
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makhtut -d makhtut"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  objects:

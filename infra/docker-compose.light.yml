# One API worker; no PostgreSQL, Redis or inference worker required in this profile.
services:
  api:
    build: ../services/api
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.25
    pids_limit: 128
    environment:
      APP_ENV: production
      DEPLOYMENT_PROFILE: light
      AUTH_SECRET: "${AUTH_SECRET:?set a strong AUTH_SECRET}"
      CORS_ORIGINS: "${CORS_ORIGINS:?set the deployed website origin}"
      RATE_LIMIT_PER_MINUTE: "90"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--limit-concurrency", "24", "--timeout-keep-alive", "5"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - metadata:/data/metadata
      - objects:/data/objects
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  metadata:
  objects:

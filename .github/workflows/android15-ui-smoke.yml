name: Android 15 UI Smoke

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
    branches: ["main"]

jobs:
  android15:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [en, ar]
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Prepare Android tool paths
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/android-avd" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/android-avd"

      - name: Install Android 15 emulator image
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          test -n "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;default;x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          echo "no" | "$AVDMANAGER" create avd -n api35-smoke -k "system-images;android-35;default;x86_64" --force
          test -f "$ANDROID_AVD_HOME/api35-smoke.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Start Android 15 emulator
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -f "$ANDROID_AVD_HOME/api35-smoke.ini"

          "$EMULATOR" -avd api35-smoke             -no-window -gpu swiftshader_indirect -no-snapshot             -noaudio -no-boot-anim -no-metrics             -camera-back none -camera-front none             > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"

          "$ADB" start-server
          "$ADB" wait-for-device

          ready=0
          for i in $(seq 1 240); do
            boot="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            package_ok="$("$ADB" shell cmd package list packages 2>/dev/null | head -n 1 || true)"
            if [ "$boot" = "1" ] && [ -n "$package_ok" ]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "Android 15 emulator did not become ready."
            cat "$RUNNER_TEMP/emulator.log" || true
            exit 1
          fi

          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" shell wm dismiss-keyguard || true
          "$ADB" devices -l

      - name: Configure compact phone
        run: |
          adb shell wm size 720x1280
          adb shell wm density 320

      - name: Run navigation smoke test on Android 15
        working-directory: apps/android
        run: gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.language=${{ matrix.language }} --stacktrace

      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" devices -l || true
          "$ADB" logcat -d -t 600 > "$RUNNER_TEMP/logcat.txt" || true
          tail -n 400 "$RUNNER_TEMP/emulator.log" || true
          tail -n 400 "$RUNNER_TEMP/logcat.txt" || true

      - name: Collect UI proof
        if: always()
        run: adb pull /sdcard/Pictures/MakhtutUiProof apps/android/ui-proof

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android15-compact-${{ matrix.language }}
          path: |
            apps/android/ui-proof/
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

      - name: Stop emulator
        if: always()
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" emu kill || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi

[project]
name = "al-makhtut-al-hayy-api"
version = "0.1.0rc1"
description = "API for Al-Makhtut-Al-Hayy / Living Manuscript"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.8,<1"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 100
